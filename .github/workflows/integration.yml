# Post-deploy integration smoke test against the LIVE service.
# Runs automatically after a successful deploy workflow, plus manual dispatch.
# Asserts on the public surface only — no secrets needed (two-class
# rejection checks need no valid JWT by design).

name: integration

on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: Live smoke (AC-B1/B3/B10 surface)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BASE: ${{ vars.FA_NETWORK_URL }}
    steps:
      - name: Check BASE variable
        run: |
          if [ -z "$BASE" ]; then
            echo "Set repo variable FA_NETWORK_URL (e.g. https://network.fa1.dev)" >&2
            exit 1
          fi

      - name: Docs + OpenAPI served
        run: |
          docs=$(curl -sf "$BASE/docs")
          echo "$docs" | grep -q "SwaggerUIBundle"
          curl -sf "$BASE/openapi.yaml" | grep -q "openapi: 3.0.3"
          echo "docs + openapi OK"

      - name: AC-B1 — create network without JWT → 401, zero side effects
        run: |
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' \
            -X POST "$BASE/api/networks" \
            -H 'Content-Type: application/json' \
            -d '{"name":"smoke-net","password":"smoke-password-123"}')
          [ "$code" = "401" ] || { cat /tmp/r.json; exit 1; }
          grep -q '"code":"unauthorized"' /tmp/r.json
          echo "unauthenticated create rejected 401"

      - name: AC-B3 — garbage management token rejected by class
        run: |
          for m in GET POST DELETE; do
            code=$(curl -s -o /tmp/r.json -w '%{http_code}' \
              -X "$m" "$BASE/api/networks/smoke-net/channels" \
              -H "Authorization: Bearer garbage-token" \
              -H 'Content-Type: application/json' -d '{}')
            case "$code" in 401|403) ;; *) cat /tmp/r.json; exit 1;; esac
          done
          echo "guest/garbage tokens rejected on management routes"

      - name: No existence oracle — join unknown network is generic error
        run: |
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' \
            -X POST "$BASE/api/networks/does-not-exist/join" \
            -H 'Content-Type: application/json' \
            -d '{"password":"whatever-123","displayName":"smoke"}')
          case "$code" in 401|403|404) ;; *) cat /tmp/r.json; exit 1;; esac
          echo "generic error, no oracle (got $code)"

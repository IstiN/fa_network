# Deploys fa_network to Google Cloud Run.
# Principles mirror IstiN/auth: every value is an env var documented in
# .env.example; nothing secret lives in this file or the repo.
#
# One-time repo setup (Settings → Secrets and variables → Actions):
#   Variables: GCP_PROJECT_ID, GCP_REGION, CLOUD_RUN_SERVICE
#   Secrets:   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT
# One-time GCP setup (README §Deploy): WIF pool/provider + Secret Manager
# entries — fill real values there later, no code change needed.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gates (deploy blocker)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./... && go vet ./...
      - run: go test ./...

  deploy:
    name: Cloud Run
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --source . \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --port 8080 \
            --cpu 1 --memory 512Mi \
            --min-instances 0 --max-instances 3 \
            --concurrency 100 \
            --add-cloudsql-instances ai-native-478811:us-central1:learn-ai-db \
            --allow-unauthenticated \
            --set-env-vars FA_NETWORK_AUTH_PROVIDER=ai-native,FA_NETWORK_AUTH_BASE_URL=https://ai-native.cloud,FA_NETWORK_RETENTION_INACTIVITY_DAYS=30,FA_NETWORK_DAP_URL=wss://hub.fa1.dev/ws \
            --set-secrets FA_NETWORK_DATABASE_URL=fa-network-database-url:latest,FA_NETWORK_WEBHOOK_SECRET=fa-network-webhook-secret:latest,FA_NETWORK_DAP_SECRET=dap-hub-master-secret:latest

      - name: Service URL
        run: |
          gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format 'value(status.url)'
